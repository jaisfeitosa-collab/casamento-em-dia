
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme sua presença | Meu Coração</title>
  <link rel="preload" href="fonts/playfair-display-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/meu-coracao.css">
</head>
<body>
  <main class="rsvp">
    <a class="logo" href="convite.html" aria-label="Meu Coração">
      <img src="img/logo.png" alt="meu♥">
    </a>

    <h1>Confirme sua presença</h1>
    <p class="intro">
      Por favor, informe se você poderá comparecer ao nosso casamento
    </p>

    <p id="nome-convidado" class="convite-de oculto"></p>

    <section class="cartao-rsvp">
      <div id="erro-convite" class="oculto">
        <h2>Convite não encontrado</h2>
        <p class="mensagem erro">
          Confira o link que você recebeu ou fale com os noivos.
        </p>
      </div>

      <form id="form-rsvp" class="oculto" novalidate>
        <p id="resposta-atual" class="mensagem oculto"></p>

        <h2>Você poderá comparecer?</h2>

        <div class="opcoes" role="group" aria-label="Presença">
          <button
            type="button"
            id="opcao-sim"
            class="opcao"
            data-status="confirmado">
            <i class="ic ic-check-c"></i>
            Sim, estarei presente!
          </button>

          <button
            type="button"
            id="opcao-nao"
            class="opcao"
            data-status="ausente">
            <i class="ic ic-x-c"></i>
            Infelizmente, não poderei ir.
          </button>
        </div>

        <!-- Contador de acompanhantes -->
        <div
          id="bloco-acompanhantes"
          class="acompanhantes-box oculto">

          <label
            id="titulo-acompanhantes"
            for="acompanhantes">
            Quantos acompanhantes você levará?
          </label>

          <div class="contador-acompanhantes">
            <button
              type="button"
              id="diminuir-acompanhantes"
              class="contador-botao"
              aria-label="Diminuir acompanhantes">
              −
            </button>

            <output
              id="numero-acompanhantes"
              for="diminuir-acompanhantes aumentar-acompanhantes"
              aria-live="polite">
              0
            </output>

            <button
              type="button"
              id="aumentar-acompanhantes"
              class="contador-botao"
              aria-label="Aumentar acompanhantes">
              +
            </button>
          </div>

          <!-- Campo mantido para integração com o JavaScript -->
          <select
            id="acompanhantes"
            name="acompanhantes"
            class="oculto"
            aria-label="Quantidade de acompanhantes"
            tabindex="-1">
            <option value="0">Nenhum acompanhante</option>
          </select>

          <p
            id="limite-acompanhantes"
            class="limite-acompanhantes">
          </p>

          <p id="total-pessoas" class="total-pessoas">
            Total de pessoas no convite: 1
          </p>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

        <button type="submit" id="enviar" class="botao">
          Confirmar resposta
          <i class="ic ic-chev"></i>
        </button>
      </form>
    </section>
  </main>

  <script src="js/rsvp-visual.js"></script>
</body>
</html>
