
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Casamento em Dia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Casamento em Dia</h1>
    <h2>Painel Administrativo</h2>
  </header>

  <main>
    <section>
      <h3>Cadastrar convidado</h3>

      <form id="form-convidado">
        <label for="nome">Nome do convidado:</label>
        <input type="text" id="nome" required>

        <button type="submit">
          Cadastrar convidado
        </button>
      </form>
    </section>

    <section>
      <h3>Lista de convidados</h3>
      <div id="lista-convidados">
        <p>Nenhum convidado cadastrado.</p>
      </div>
    </section>
  </main>

 <script type="module" src="js/admin.js"></script>
</body>
</html>
